  </defs>

  <!-- FREE lane -->
  <rect x="20" y="20" width="1360" height="290" rx="16" fill="#E3F1EF" stroke="#9cc9c2"/>
  <text x="44" y="54" class="h" fill="#0F766E">Switch a project to FREE</text>

  <g id="f1">

    <text x="62" y="190" class="s">Paid used up:</text>
    <text x="62" y="210" class="c">Ctrl+Option+Cmd+F (Mac)</text>
    <text x="62" y="230" class="c">Ctrl+Alt+Shift+F (Win)</text>
    <text x="62" y="258" class="s">The shortcut needs no Claude.</text>
  </g>
  <g>
    <rect x="334" y="78" width="270" height="200" rx="12" fill="#fff" stroke="#9cc9c2"/>

    <text x="352" y="254" class="s">Permissions are not touched.</text>
  </g>
  <g>
    <rect x="644" y="78" width="230" height="200" rx="12" fill="#fff" stroke="#9cc9c2"/>

    <text x="662" y="210" class="c">/clear</text>
    <text x="662" y="238" class="s">Free models hold at most</text>
    <text x="662" y="258" class="s">128K tokens.</text>
  </g>

    <text x="934" y="246" class="s">or out of free use → OmniRoute tries the next one.</text>
  </g>
  <path d="M294,178 L332,178" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M604,178 L642,178" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a)"/>
  <path d="M874,178 L912,178" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a)"/>

  <text x="44" y="370" class="h" fill="#4a4f57">Switch a project back to PAID</text>
  <g>
    <rect x="44" y="394" width="250" height="196" rx="12" fill="#fff" stroke="#C9C8C2"/>
    <circle cx="70" cy="420" r="14" fill="#6B6F76"/><text x="65" y="425" class="n">1</text>
    <text x="94" y="426" class="t">Start the switch</text>
    <text x="62" y="458" class="c">/omni paid</text>
    <text x="62" y="488" class="s">or the shortcut:</text>
    <text x="62" y="508" class="c">Ctrl+Option+Cmd+P (Mac)</text>
    <text x="62" y="528" class="c">Ctrl+Alt+Shift+P (Win)</text>
  </g>
  <g>
    <rect x="334" y="394" width="270" height="196" rx="12" fill="#fff" stroke="#C9C8C2"/>
    <circle cx="360" cy="420" r="14" fill="#6B6F76"/><text x="355" y="425" class="n">2</text>
    <text x="384" y="426" class="t">Settings are restored</text>
    <text x="352" y="458" class="s">The free-mode settings are</text>
    <text x="352" y="478" class="s">removed. Your own values come</text>
    <text x="352" y="498" class="s">back, for example your paid</text>
    <text x="352" y="518" class="s">model (Opus).</text>
  </g>
  <g>
    <rect x="644" y="394" width="230" height="196" rx="12" fill="#fff" stroke="#C9C8C2"/>
    <circle cx="670" cy="420" r="14" fill="#6B6F76"/><text x="665" y="425" class="n">3</text>
    <text x="694" y="426" class="t">Reload the window</text>
    <text x="662" y="458" class="s">The Mac shortcut reloads</text>
    <text x="662" y="478" class="s">by itself. Otherwise:</text>
    <text x="662" y="498" class="s">Cmd/Ctrl+Shift+P →</text>
    <text x="662" y="518" class="s">Developer: Reload Window</text>
  </g>
  <g>
    <rect x="914" y="394" width="442" height="196" rx="12" fill="#fff" stroke="#C9C8C2"/>
    <circle cx="940" cy="420" r="14" fill="#6B6F76"/><text x="935" y="425" class="n">4</text>

    <rect x="934" y="450" width="120" height="48" rx="8" fill="#F2F1EC"/><text x="947" y="479" class="s">Claude Code</text>

    <text x="934" y="560" class="s">Each project keeps its own mode.</text>

  <path d="M604,492 L642,492" stroke="#6B6F76" stroke-width="2.4" marker-end="url(#p)"/>
